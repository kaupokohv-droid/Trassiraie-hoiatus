name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TrassiHoiatus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --version && gradle assembleDebug --stacktrace
      - name: Kontrolli APK allkirja
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Trassihoiatus-APK
          path: TrassiHoiatus/app/build/outputs/apk/debug/*.apk
